# Serves one static page for the HTTP response header report test.
services:
  web:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ./index.html:/www/index.html:ro
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 1s
      timeout: 2s
      retries: 20
