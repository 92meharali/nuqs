# Allows a public handshake with an empty directory and no file transfers.
listen=YES
listen_ipv6=NO
listen_port=2121
background=NO
anonymous_enable=YES
local_enable=NO
write_enable=NO
download_enable=NO
dirlist_enable=NO
port_enable=NO
pasv_enable=NO
anon_root=/srv/public
secure_chroot_dir=/var/empty
xferlog_enable=NO
